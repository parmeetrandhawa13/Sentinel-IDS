<svg width="900" height="160" viewBox="0 0 900 160" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif">
  <defs>
    <style>
      .box { fill:#0d1522; stroke:#22d3ee; stroke-width:1.4; rx:10; }
      .label { fill:#e2e8f0; font-size:13px; font-weight:600; text-anchor:middle; }
      .arrow { stroke:#334155; stroke-width:2; marker-end:url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="10"  y="55" width="130" height="50" class="box"/>
  <text x="75"  y="85" class="label">Network Traffic</text>
  <line x1="140" y1="80" x2="180" y2="80" class="arrow"/>

  <rect x="185" y="55" width="140" height="50" class="box"/>
  <text x="255" y="85" class="label">Feature Extraction</text>
  <line x1="325" y1="80" x2="365" y2="80" class="arrow"/>

  <rect x="370" y="55" width="150" height="50" class="box"/>
  <text x="445" y="85" class="label">Data Preprocessing</text>
  <line x1="520" y1="80" x2="560" y2="80" class="arrow"/>

  <rect x="565" y="55" width="130" height="50" class="box"/>
  <text x="630" y="85" class="label">Random Forest</text>
  <line x1="695" y1="80" x2="735" y2="80" class="arrow"/>

  <rect x="740" y="55" width="150" height="50" class="box"/>
  <text x="815" y="80" class="label">Majority Voting</text>
  <text x="815" y="96" class="label" font-size="11" fill="#94a3b8">→ Classification</text>
</svg>
